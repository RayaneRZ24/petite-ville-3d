<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcades originales · Turbo City et Ballon Pop</title>
  <link rel="stylesheet" href="style.css">
  <script src="../../libraries/3d/yuka.js"></script>
  <script src="../../arcade/ArcadeTrack.js"></script><script src="../../arcade/NeuralPolicy.js"></script>
  <script src="../../arcade/ArcadeDrive.js"></script><script src="../../arcade/ArcadeRacer.js"></script>
  <script src="../../arcade/ArcadeGhostDrive.js"></script><script src="../../arcade/ArcadeGhost.js"></script>
  <script src="../../arcade/BalloonDrift.js"></script><script src="../../arcade/BalloonTarget.js"></script>
  <script src="../../arcade/ArcadeSession.js"></script><script src="../../arcade/ArcadeView.js"></script>
  <script src="../../neuro/savedCampaignData.js"></script><script src="classicArcade.js" defer></script>
</head>
<body>
  <nav id="race-modes" aria-label="Mode de course"><button type="button" data-mode="race">Course chrono</button><button type="button" data-mode="ghost">Défier le cerveau entraîné</button></nav>
  <div id="score"><strong id="classic-stats"></strong><span id="classic-record"></span></div>
  <canvas id="classic-canvas" width="1200" height="760" tabindex="0" aria-label="Jeu arcade : conduire avec les flèches ou ZQSD ; viser les ballons au clic"></canvas>
  <div id="classic-pad" aria-label="Commandes tactiles"><button type="button" data-control="left" aria-label="Tourner à gauche">◀</button><button type="button" data-control="throttle">ACCÉLÉRER ▲</button><button type="button" data-control="brake">FREIN ▼</button><button type="button" data-control="right" aria-label="Tourner à droite">▶</button></div>
  <p id="classic-help">Flèches / ZQSD / WASD ou commandes tactiles · Espace : pause · Échap : retour à la ville</p>
</body>
</html>
